<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8">
  <title>457 Property</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="home-header">
    <p>457 Property</p>
    <h1>Welcome</h1>
  </header>
  <main class="home-main">
    <a class="map-card" href="map.html" aria-label="Open the Property Map">
      <svg class="parcel-icon" viewBox="0 0 180 220" role="img" aria-labelledby="map-icon-title">
        <title id="map-icon-title">Property Map</title>
        <path d="M17 136 L22 137 L15 151 L20 176 L34 205 L165 192 L153 15 L145 17 L129 17 L85 22 L68 25 Z"></path>
        <text x="94" y="104">Property</text>
        <text x="94" y="127">Map</text>
      </svg>
      <span>Approximate boundaries, aerial and topo views, and live location</span>
    </a>
    <!-- Static QR target: regenerate this asset if the public site URL changes. -->
    <section class="home-qr" aria-labelledby="home-qr-caption">
      <div class="home-qr-image">
        <img src="assets/qr/457-map-qr.svg" width="165" height="165" alt="QR code linking to the 457 Property map">
      </div>
      <p id="home-qr-caption">Scan to open this map</p>
      <p class="home-qr-url">tbsupp112.github.io/457-map/</p>
    </section>
    <section class="home-routes" id="home-routes" aria-labelledby="home-routes-title" hidden>
      <h2 id="home-routes-title">Walking routes</h2>
      <div id="home-route-list"></div>
    </section>
  </main>
  <script>
    "use strict";
    fetch("data/trails/routes.json")
      .then((response) => {
        if (!response.ok) throw new Error(`Could not load routes: ${response.status}`);
        return response.json();
      })
      .then((data) => {
        const routes = Array.isArray(data.routes) ? data.routes : [];
        if (routes.length === 0) return;
        const section = document.getElementById("home-routes");
        const list = document.getElementById("home-route-list");
        routes.forEach((route) => {
          if (!route?.id || !route.name) return;
          const entry = document.createElement("article");
          const link = document.createElement("a");
          const title = document.createElement("strong");
          const facts = document.createElement("span");
          const description = document.createElement("span");
          link.href = `map.html?feature=${encodeURIComponent(route.id)}`;
          title.textContent = route.name;
          facts.textContent = [
            Number.isFinite(route.length_ft) ? `${route.length_ft.toLocaleString()} ft` : "",
            route.difficulty || "",
            route.shape || "",
          ].filter(Boolean).join(" · ");
          description.textContent = route.description || "Open this route on the property map.";
          link.append(title, facts, description);
          entry.append(link);
          list.append(entry);
        });
        section.hidden = list.childElementCount === 0;
      })
      .catch(() => {});
  </script>
</body>
</html>

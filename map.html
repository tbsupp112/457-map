<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14231d">
  <title>457 Property Map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260805-8">
</head>
<body>
  <main id="map" aria-label="Interactive map of the approximate 457 Property boundaries"></main>
  <div class="guidance-tint" id="guidance-tint" aria-hidden="true"></div>
  <a class="map-control home-link" href="index.html" aria-label="Return to the home page" title="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"></path></svg>
  </a>

  <button class="map-control info-button" id="info-button" type="button" aria-label="Map information" aria-expanded="false" title="Map information">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 10.5v6M12 7.5h.01"></path></svg>
  </button>

  <div class="info-overlay" id="info-overlay" hidden>
    <section class="info-dialog" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <button class="info-close" id="info-close" type="button" aria-label="Close map information">×</button>
      <h2 id="info-title">Approximate boundary — not a survey</h2>
      <p>For orientation only. Do not rely on this map for legal or boundary work.</p>
    </section>
  </div>

  <div class="location-panel" aria-live="polite">
    <p id="location-status">Tap the location arrow to show your location.</p>
    <button class="map-control" id="locate-button" type="button" aria-label="Show my location" title="Show my location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19.5 4.5-7.1 15-2.1-6.8-6.8-2.1 16-6.1Z"></path></svg>
    </button>
  </div>
  <div class="guidance-pill" id="guidance-pill" role="status" aria-live="polite" hidden>
    <button id="guidance-dismiss" type="button" aria-label="End landmark guidance">
      <span id="guidance-pill-text">Guidance</span>
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <noscript>This map requires JavaScript.</noscript>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js?v=20260805-8"></script>
</body>
</html>
